[package]
name = "rustlauncher"
version = "0.1.0"
edition = "2021"
description = "Prosty launcher Minecraft Java napisany w Rust (Fabric + Modrinth)"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
hex = "0.4"
md5 = "0.7"
zip = "2"
flate2 = "1"
tar = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
futures = "0.3"
indicatif = "0.17"

[profile.release]
opt-level = 3
lto = true
strip = true
